hydra:
  searchpath:
    - pkg://verl/trainer/config
defaults:
  - ppo_trainer
  - _self_
agentflow:
  port: 8620
  enable_rollout_validation: true
  max_empty_retries: 0
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  train_files: ${oc.env:FLOW_RUN_DIR}/data/train.parquet
  val_files: ${oc.env:FLOW_RUN_DIR}/data/validation.parquet
  train_batch_size: 2
  val_batch_size: null
  max_prompt_length: 18432
  max_response_length: 8192
  truncation: error
  filter_overlong_prompts: false
  shuffle: true
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:FLOW_BASE_MODEL}
    lora_rank: 32
    lora_alpha: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 2
    ppo_epochs: 1
    optim:
      lr: 1.0e-6
    use_kl_loss: true
    kl_loss_coef: 0.001
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    use_torch_compile: false
    entropy_from_logits_with_chunking: true
    fsdp_config:
      model_dtype: bfloat16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: bf16
      param_offload: false
      optimizer_offload: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: bfloat16
      mixed_precision:
        param_dtype: bf16
        reduce_dtype: bf16
        buffer_dtype: bf16
      param_offload: false
  rollout:
    name: vllm
    mode: async
    n: 6
    temperature: 0.7
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_model_len: 32768
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    enforce_eager: true
    load_format: safetensors
    layered_summon: true
    free_cache_engine: true
    log_prob_micro_batch_size_per_gpu: 1
    multi_turn:
      format: hermes
    agent:
      custom_async_server:
        path: pkg://agentflow.verl.async_server
        name: PatchedvLLMServer
trainer:
  n_gpus_per_node: 6
  nnodes: 1
  project_name: GraphRL_AgentFlow
  experiment_name: 6_1-Flow
  total_epochs: 1
  max_actor_ckpt_to_keep: 2
  save_freq: 1
  test_freq: -1
  val_before_train: false
  logger: [console]
  default_local_dir: ${oc.env:FLOW_RUN_DIR}/checkpoints
  resume_mode: disable
ray_init:
  num_cpus: 48
